combos:
- p: [1, 2]
  k: {t: Sft+-, s: Sft+1}
  l: [QWERTY, NAV, NUMBER]
- p: [2, 3]
  k: {t: Sft+2, s: Ctl+Alt+`}
  l: [QWERTY, NAV, NUMBER]
- p: [3, 4]
  k: {t: Sft+4, s: Sft+3}
  l: [QWERTY, NAV, NUMBER]
- p: [14, 15]
  k: {t: LS(5) 0, h: Alt+LGUI}
  l: [QWERTY, NAV, NUMBER]
- p: [15, 16]
  k: {t: LS(6) 0, h: 'Alt+$$mdi:apple-keyboard-shift$$'}
  l: [QWERTY, NAV, NUMBER]
- p: [16, 17]
  k: {t: Sft+7, h: 'Ctl+$$mdi:apple-keyboard-shift$$', s: Ctl+Alt+-}
  l: [QWERTY, NAV, NUMBER]
- p: [8, 9]
  k: Sft+0
  l: [QWERTY, NAV, NUMBER]
- p: [9, 10]
  k: {t: '-', s: _}
  l: [QWERTY, NAV, NUMBER]
- p: [10, 11]
  k: {t: '=', s: +}
  l: [QWERTY, NAV, NUMBER]
- p: [23, 24]
  k: {t: Sft+8, h: 'Ctl+$$mdi:apple-keyboard-shift$$', s: Ctl+Alt+7}
  l: [QWERTY, NAV, NUMBER]
- p: [24, 25]
  k: {t: Sft+9, h: 'Alt+$$mdi:apple-keyboard-shift$$', s: Ctl+Alt+0}
  l: [QWERTY, NAV, NUMBER]
- p: [25, 26]
  k: {t: BACKSLASH 0, h: Alt+RGUI}
  l: [QWERTY, NAV, NUMBER]
- p: [37, 38]
  k: {t: '`', s: Ctl+Alt+8}
  l: [QWERTY, NAV, NUMBER]
- p: [38, 39]
  k: {t: Sft+`, s: Ctl+Alt+9}
  l: [QWERTY, NAV, NUMBER]
- p: [39, 40]
  k: {t: ']', s: '}'}
  l: [QWERTY, NAV, NUMBER]
- p: [1, 15, 29]
  k: '&soft_off'
